<!doctype html>
<!--
  Solar system — WebGPU.
  SCALE NOTES (honesty first):
    * Distances: real AU ratios at 1 AU = 20 units — Neptune sits at ~601 units and the
      camera starts well inside Jupiter; zoom out or use Jump To to travel.
    * Radii: planets are to relative scale (Earth = 1 unit); the Sun is compressed from
      109× to 5× so planets stay visible instead of hugging the limb.
    * Moon orbits: real *periods*, compressed radii (see scene.js computeMoonOrbits).
    * Spins: phase-true, slowed for legibility.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solar System — WebGPU</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Layout safety-net (style.css is the primary sheet). */
    html, body, #scene { margin: 0; height: 100%; width: 100%; background: #000; }
    #scene { display: block; }
    #labels { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .label { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
             font: 13px/1.2 system-ui, sans-serif; letter-spacing: .04em; white-space: nowrap;
             text-shadow: 0 0 6px #000; opacity: .9; }
    .label-moon { font-size: 11px; opacity: .75; }
    #topbar { position: fixed; top: 0; left: 0; right: 0; padding: 10px 16px; color: #cfd6ff;
              font: 14px/1.4 system-ui; pointer-events: none; text-shadow: 0 0 8px #000; }
    #jumpList { position: fixed; right: 12px; top: 48px; display: flex; flex-direction: column; gap: 6px; }
    .jump-button { background: rgba(20,26,48,.72); color: #cfd6ff; border: 1px solid #3a4670;
                   border-radius: 6px; padding: 6px 10px; font: 12px system-ui; cursor: pointer; }
    .jump-button:hover { background: rgba(50,62,110,.85); }
    .jump-sun { color: #ffd9a8; }
    #timepanel { position: fixed; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 10px;
                 background: rgba(20,26,48,.72); border: 1px solid #3a4670; border-radius: 8px;
                 padding: 10px; color: #cfd6ff; font: 13px system-ui; }
    #timeScale { width: 220px; }
    #infoPanel { position: fixed; right: 12px; top: 190px; width: 300px; max-height: 70vh; overflow: auto;
                 background: rgba(14,18,36,.88); border: 1px solid #3a4670; border-radius: 10px;
                 padding: 14px; color: #dfe6ff; display: none; font: 13px/1.5 system-ui; }
    #infoPanel h2 { margin: 0 0 6px; font-size: 18px; }
    #infoPanel table { width: 100%; border-collapse: collapse; }
    #infoPanel td { padding: 2px 0; vertical-align: top; }
    #infoPanel td:first-child { color: #8fa0d8; width: 38%; }
    #progress { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                background: #000; color: #cfd6ff; font: 15px system-ui; }
    #nogl { position: fixed; inset: auto; left: 50%; transform: translateX(-50%); top: 30px;
            display: none; color: #ffb4a0; font: 14px system-ui; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="labels"></div>
  <div id="topbar">
    <strong>WEBGPU SOLAR SYSTEM</strong> — drag to orbit · right-drag/shift-drag to pan · wheel to zoom ·
    click a planet (or a label) for facts
  </div>
  <div id="jumpList"></div>
  <div id="timepanel">
    <button id="pauseButton" class="jump-button">❚❚ Pause</button>
    <input id="timeScale" type="range" min="0" max="1000" value="553">
    <span id="timeReadout">…</span>
  </div>
  <div id="infoPanel">
    <h2></h2>
    <table></table>
    <p></p>
  </div>
  <div id="progress"><span id="progressText">Starting…</span></div>
  <div id="nogl"></div>

  <script src="js/math.js"></script>
  <script src="js/planet-data.js"></script>
  <script src="js/orbits.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/shaders.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
