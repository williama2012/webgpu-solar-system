<!doctype html><html><head><meta charset="utf-8"></head><body>
<p>oneoff: paren-constructor modules. Wait for <code>done:</code></p>
<pre id="out">running…</pre>
<script type="module">
let result = '';
function line(s) { result += s + '\n'; }
async function main() {
  if (!('gpu' in navigator)) { line('NO_GPU'); return; }
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) { line('NO_ADAPTER'); return; }
  const device = await adapter.requestDevice();
  const uncaptured = [];
  device.onuncapturederror = (e) => { uncaptured.push(String((e && e.reason) ? (e.reason.message || e.reason) : e)); };
  async function testModule(label, code) {
    const before = uncaptured.length;
    device.pushErrorScope('validation');
    device.createShaderModule({ label, code });
    let err = null;
    try { const scope = await device.popErrorScope(); if (scope) err = String(scope.message || scope); } catch (e2) {}
    if (!err) { await new Promise(r => setTimeout(r, 150)); if (uncaptured.length > before) err = uncaptured.slice(before).join(' | '); }
    line(label + ': ' + (err ? 'INVALID — ' + err : 'OK'));
    return !err;
  }
  const p1 = 'struct V { @builtin(position) pos: vec4<f32> }; @vertex fn vs_main() -> V { return V(vec4<f32>(0.0, 1.0, 0.0, 1.0)); } @fragment fn fs_main() -> @location(0) vec4<f32> { return vec4<f32>(1.0); }';
  const p2 = 'struct B { a: f32, b: vec3<f32> }; fn g(x: f32) -> f32 { let bb = B(x * 2.0, vec3<f32>(1.0, 2.0, 3.0)); return bb.b.x + bb.a; }';
  await testModule('p1_paren_vertexout', p1);
  await testModule('p2_paren_struct', p2);
  const quad = [{ arrayStride: 8, attributes: [{ format: 'float32x2', offset: 0 }] }];
  device.pushErrorScope('validation');
  const mod = device.createShaderModule({ label: 'p1_mod', code: p1 });
  let err = null;
  try { const s = await device.popErrorScope(); if (s) err = String(s.message || s); } catch (e2) {}
  if (!err) { await new Promise(r => setTimeout(r, 150)); }
  if (err) { line('p1_pipe: MODULE INVALID — ' + err); }
  else {
    try {
      device.pushErrorScope('validation');
      device.createRenderPipeline({ layout: 'auto', vertex: { module: mod, entryPoint: 'vs_main' }, fragment: { module: mod, entryPoint: 'fs_main', targets: [{ format: 'rgba8unorm' }] } });
      const sp = await device.popErrorScope();
      if (sp) line('p1_pipe: INVALID — ' + String(sp.message || sp)); else line('p1_pipe: OK');
    } catch (e2) { line('p1_pipe: THROWS ' + e2.message); }
  }
}
main().catch(e => line('PROBE-ERROR ' + (e && e.message || e)));
const _t = setInterval(() => { const lines = result.split('\n').filter(s => s.length > 0); if (lines.filter(s => /^p\d/.test(s)).length >= 3) { clearInterval(_t); document.getElementById('out').textContent = 'done:\n' + result; } }, 200);
</script></body></html>
