<!doctype html><html><head><meta charset="utf-8"></head><body>
<p>WGSL probe v7 (struct separator matrix + live app-shader retest). Wait for <code>done:</code> in the box below.</p>
<pre id="out">running…</pre>
<script type="module">
let result = '';
function line(s) { result += s + '\n'; }
line('UA: ' + navigator.userAgent);
async function main() {
  if (!('gpu' in navigator)) { line('NO navigator.gpu'); line('ALL-TESTS-DONE'); return; }
  const adapter = await navigator.gpu.requestAdapter();
  line('adapter-arch: ' + (adapter && adapter.info ? (adapter.info.architecture || '?') : 'NONE'));
  if (!adapter) { line('ALL-TESTS-DONE'); return; }
  const device = await adapter.requestDevice();
  const uncaptured = [];
  device.onuncapturederror = (e) => { uncaptured.push(String((e && e.reason) ? (e.reason.message || e.reason) : e)); };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  async function testModule(label, code) {
    const before = uncaptured.length;
    device.pushErrorScope('validation');
    device.createShaderModule({ label, code });
    let err = null;
    try { const scope = await device.popErrorScope(); if (scope) err = String(scope.message || scope); } catch (e2) {}
    if (!err) { await sleep(150); if (uncaptured.length > before) err = uncaptured.slice(before).join(' | '); }
    line(label + ': ' + (err ? 'INVALID — ' + err : 'OK'));
    return !err;
  }

  const tests = {
    s4_semi_knownfail: 'struct A { x: f32; y: i32; };',
    s1_comma: 'struct A { x: f32, y: i32 };',
    s2_bare: 'struct A { x: f32 };',
    s3_trailcomma: 'struct A { x: f32, };',
    s5_semicomma: 'struct A { x: f32;, y: i32; };',
    s6_comma_annot: 'struct A { @location(0) p: vec2<f32>, @location(1) uv: vec3<f32> };',
    s7_comma_trailcomma: 'struct A { @location(0) p: vec2<f32>, @location(1) uv: vec3<f32>, };'
  };
  let anyOk = false;
  for (const k of Object.keys(tests)) { if (await testModule(k, tests[k])) anyOk = true; }

  // live app shaders under the best-guess dialect: field-terminator ';' -> ',' (code part only)
  const live = await (await fetch('/src/renderer.js', { cache: 'no-store' })).text();
  function rawBody(name) {
    const marker = 'const ' + name;
    const i = live.indexOf(marker); if (i < 0) return null;
    let p = i + marker.length; while (p < live.length && live[p] !== '`') p += 1;
    const start = p + 1; let q = start;
    for (;;) { const c = live[q]; if (c === '\\') q += 2; else if (c === '`') break; else q += 1; }
    return live.slice(start, q);
  }
  const Graw = rawBody('GLOBAL_UNIFORMS_WGSL');
  const Sraw = rawBody('SHADER_BACKGROUND_STARS');
  line('extract: G=' + (Graw ? Graw.length : 'NO') + ' S=' + (Sraw ? Sraw.length : 'NO'));
  if (Graw && Sraw) {
    // per-line: cut code at first '//' or line end, move last ';' of the code part -> ','
    function commaFields(src) {
      return src.split('\n').map((l) => {
        let cut = l.length; const c = l.indexOf('//'); if (c >= 0) cut = c;
        const seg = l.slice(0, cut);
        if (!seg.includes(';')) return l;
        const code = seg.replace(/;/g, ',');
        return code + l.slice(cut);
      }).join('\n');
    }
    const Gc = commaFields(Graw).replace(/^\n+/, '');
    await testModule('g_comma_fields', Gc);
    const Sc = commaFields(Sraw.replace('${GLOBAL_UNIFORMS_WGSL}', Gc)).replace(/^\n+/, '');
    line('Sc lines=' + Sc.split('\n').length);
    for (let i = 0; i < 3; i += 1) line('Sc[' + i + ']=' + JSON.stringify(Sc.split('\n')[i].slice(0, 72)));
    await testModule('s_comma_fields', Sc);

    // pipeline proof with the dialect-converted stars shader
    const quad = [{ arrayStride: 8, attributes: [{ format: 'float32x2', offset: 0 }] }];
    async function testPipeline(label, code) {
      const before = uncaptured.length;
      let mod;
      try { device.pushErrorScope('validation'); mod = device.createShaderModule({ label: label + '_mod', code }); } catch (e2) { line(label + ': MOD-THROWS ' + e2); return; }
      let err = null;
      try { const scope = await device.popErrorScope(); if (scope) err = String(scope.message || scope); } catch (e3) {}
      if (!err) { await sleep(150); if (uncaptured.length > before) err = uncaptured.slice(before).join(' | '); }
      if (err) { line(label + ': MODULE INVALID — ' + err); return; }
      try {
        device.pushErrorScope('validation');
        device.createRenderPipeline({ layout: 'auto', vertex: { module: mod, entryPoint: 'vs_main' }, fragment: { module: mod, entryPoint: 'fs_main', targets: [{ format: 'rgba8unorm' }] } });
        const scopeP = await device.popErrorScope();
        let perr = scopeP ? String(scopeP.message || scopeP) : null;
        if (!perr) { await sleep(150); if (uncaptured.length > before) perr = uncaptured.slice(before).join(' | '); }
        line(label + ': PIPE ' + (perr ? 'INVALID — ' + perr : 'OK'));
      } catch (e2) { line(label + ': PIPE-THROWS ' + e2.message); }
    }
    await testPipeline('P_stars_comma', Sc);
    // vertex-output-struct dialect form (pos first is fine only if separator fixed; test annotated struct w/ commas)
    const vout = 'struct V { @builtin(position) pos: vec2<f32> }; @vertex fn vs_main() -> V { return V{vec2<f32>(0.0, 1.0)}; } @fragment fn fs_main() -> @location(0) vec4<f32> { return vec4<f32>(1.0); }';
    await testModule('v_out_struct_comma', vout);
    if (!anyOk) line('VERDICT: NO separator form accepted for struct fields');
  }
  line('ALL-TESTS-DONE');
}
main().catch((e) => { line('PROBE-ERROR ' + (e && e.message || e)); });
const _t = setInterval(() => { if (result.includes('ALL-TESTS-DONE') || result.includes('NO navigator.gpu') || result.includes('PROBE-ERROR')) { clearInterval(_t); document.getElementById('out').textContent = 'done:\n' + result; } }, 200);
</script></body></html>
